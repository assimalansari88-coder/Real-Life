    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}.app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100dvh}.sidebar{background:linear-gradient(160deg,#181722,#15151f 55%,#17141e);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px 16px;min-width:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 24px}.mark{width:38px;height:38px;border-radius:14px;background:linear-gradient(140deg,var(--pink),var(--violet) 56%,var(--cyan));display:grid;place-items:center;box-shadow:0 5px 24px #bb76eb55}.mark svg{width:24px}.brand strong{font-size:20px;letter-spacing:.2px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}.new-chat{border:0;border-radius:14px;padding:12px 14px;background:linear-gradient(105deg,#9d79f3,#d779df);color:#fff;font-weight:700;display:flex;justify-content:center;align-items:center;gap:9px;box-shadow:0 8px 25px #9869dd35;transition:transform .2s,filter .2s}.new-chat:hover{transform:translateY(-1px);filter:brightness(1.06)}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#797687;padding:26px 8px 10px}.chat-list{overflow:auto;flex:1;display:flex;flex-direction:column;gap:4px}.chat-item{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:1px solid transparent;background:transparent;color:var(--soft);border-radius:11px;padding:10px 11px;font-size:13px;cursor:pointer}.chat-item:hover,.chat-item.active{background:#ffffff0a;color:var(--text)}.chat-item.active{border-color:#ffffff0d}.chat-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.delete-chat{visibility:hidden;opacity:.6;background:none;border:0;color:var(--muted);font-size:17px;padding:0 2px}.chat-item:hover .delete-chat{visibility:visible}.delete-chat:hover{color:#ff8aab;opacity:1}.side-bottom{border-top:1px solid var(--line);padding-top:13px;display:flex;align-items:center;gap:10px}.profile-mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#f58fc8,#8077f4);color:#171321;font-weight:800}.profile-copy{flex:1}.profile-copy b{font-size:12px;display:block}.profile-copy small{color:var(--muted);font-size:10px}.icon-btn{border:1px solid transparent;background:transparent;color:var(--muted);width:38px;height:38px;display:grid;place-items:center;border-radius:12px}.icon-btn:hover{background:#ffffff0b;color:var(--text);border-color:var(--line)}.icon-btn svg{width:18px;height:18px}.main{min-width:0;display:flex;flex-direction:column;position:relative;background:radial-gradient(ellipse 680px 470px at 52% 18%,#39304a48,transparent 75%),radial-gradient(ellipse 480px 400px at 92% 88%,#232c4240,transparent 74%),var(--bg)}.topbar{height:68px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,52px);border-bottom:1px solid #ffffff0a}.top-left{display:flex;gap:12px;align-items:center}.mobile-brand{display:none;align-items:center;gap:8px;font-weight:750}.mobile-brand .mark{width:29px;height:29px;border-radius:10px}.mobile-brand .mark svg{width:18px}.model-tag{font-size:12px;color:var(--soft);border:1px solid var(--line);background:#ffffff06;border-radius:99px;padding:7px 11px;display:flex;align-items:center;gap:7px}.status-dot{width:7px;height:7px;border-radius:99px;background:#8fdfa9;box-shadow:0 0 9px #8fdfa966}.top-actions{display:flex;gap:6px;align-items:center}.main-scroll{flex:1;overflow:auto;scroll-behavior:smooth}.content{width:min(780px,100%);min-height:100%;margin:0 auto;padding:32px 28px 18px;display:flex;flex-direction:column}.welcome{margin:auto 0 14px;text-align:center;padding-top:14px}.orb{width:82px;height:82px;margin:0 auto 22px;border-radius:27px;background:linear-gradient(140deg,#f28fdb 0%,#aa81f6 55%,#7fc7eb);box-shadow:0 0 70px #b57cf34a;display:grid;place-items:center;position:relative}.orb:after{content:"";position:absolute;inset:-8px;border:1px solid #d39be84c;border-radius:32px;animation:pulse 3s ease-in-out infinite}.orb svg{width:43px;filter:drop-shadow(0 2px 5px #28113755)}@keyframes pulse{50%{transform:scale(1.045);opacity:.45}}.welcome h1{font-size:clamp(27px,4vw,38px);letter-spacing:-.8px;margin:0 0 10px;font-weight:730}.gradient-text{background:linear-gradient(100deg,#f29bd7,#b697ff 55%,#95d6f3);color:transparent;background-clip:text}.welcome p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}.suggestions{width:min(690px,100%);margin:22px auto 22px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.suggestion{min-height:76px;border:1px solid #ffffff12;background:linear-gradient(145deg,#ffffff08,#ffffff04);border-radius:15px;text-align:right;padding:13px 15px;transition:.18s}.suggestion:hover{border-color:#c580ed66;transform:translateY(-2px);background:#ffffff0b}.suggestion strong{font-size:12px;display:block;margin-bottom:5px}.suggestion span{font-size:11px;color:var(--muted)}.messages{width:min(740px,100%);margin:0 auto;display:flex;flex-direction:column;gap:25px;padding:18px 0 24px}.message{display:flex;gap:13px;align-items:flex-start;animation:rise .22s ease-out}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.message.user{flex-direction:row-reverse}.avatar{width:30px;height:30px;flex:none;border-radius:11px;display:grid;place-items:center;background:linear-gradient(140deg,#ee8fd7,#877df4);color:#191421}.avatar svg{width:18px}.user .avatar{background:#373244;color:#e6c9f4}.message-body{max-width:min(88%,650px);min-width:0}.message.user .message-body{background:var(--user);border:1px solid #ffffff0b;padding:12px 15px;border-radius:18px 6px 18px 18px}.message.assistant .message-body{padding-top:4px;line-height:1.85;font-size:14px;color:#eeeaf4}.message-text{overflow-wrap:anywhere}.message-text p{margin:0 0 10px}.message-text p:last-child{margin-bottom:0}.message-text ul,.message-text ol{padding-inline-start:23px}.message-text code{background:#ffffff12;padding:2px 5px;border-radius:5px;font-family:ui-monospace,monospace;font-size:.9em}.message-text pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#09090e;border:1px solid var(--line);padding:14px;border-radius:12px;direction:ltr;text-align:left}.message-text h1,.message-text h2,.message-text h3{line-height:1.4;margin:12px 0 6px}.message-actions{display:flex;gap:4px;margin-top:8px;opacity:.68}.message-actions button{font-size:11px;color:var(--muted);background:none;border:0;padding:5px 7px;border-radius:7px}.message-actions button:hover{background:#ffffff0b;color:var(--text)}.typing{display:inline-flex;gap:4px;padding:10px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:#c5a1ec;animation:bop 1.1s infinite}.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}@keyframes bop{50%{opacity:.3;transform:translateY(-3px)}}.composer-wrap{width:min(780px,100%);margin:0 auto;padding:0 28px calc(20px + env(safe-area-inset-bottom));flex:none}.composer{border-radius:23px;background:linear-gradient(145deg,#201e2b,#1a1924);border:1px solid #ffffff16;box-shadow:var(--shadow),inset 0 1px #ffffff0a;padding:11px 12px 10px;transition:border-color .2s,box-shadow .2s}.composer:focus-within{border-color:#ac7de577;box-shadow:0 0 0 3px #a871d51e,0 20px 70px #0004}.composer textarea{display:block;width:100%;min-height:56px;max-height:190px;resize:none;background:transparent;color:var(--text);border:0;outline:0;padding:9px 8px;font-size:14px;line-height:1.7}.composer textarea::placeholder{color:#8b8799}.composer textarea:focus-visible{outline:none}.composer-bottom{display:flex;align-items:center;justify-content:space-between;padding:1px 2px 0}.composer-hint{font-size:10px;color:#827f8f;padding-inline-start:8px}.send{width:38px;height:38px;border:0;border-radius:13px;background:linear-gradient(140deg,#d77ddf,#8d7ef5);color:white;display:grid;place-items:center;box-shadow:0 4px 15px #ad75df4f;transition:.15s}.send:hover{filter:brightness(1.12);transform:translateY(-1px)}.send:disabled{opacity:.4;filter:grayscale(.6);transform:none}.send svg{width:18px}.disclaimer{font-size:10px;color:#777484;text-align:center;padding-top:10px}.toast{position:fixed;bottom:112px;left:50%;transform:translate(-50%,12px);padding:10px 15px;background:#292735;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;color:var(--text);font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:min(90vw,440px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.backdrop{display:none}
    @media(max-width:850px){.app{grid-template-columns:minmax(0,1fr)}.sidebar{position:fixed;top:0;bottom:0;right:0;width:min(300px,88vw);transform:translateX(105%);transition:transform .25s;box-shadow:var(--shadow)}.app.menu-open .sidebar{transform:translateX(0)}.app.menu-open .backdrop{display:block;position:fixed;inset:0;background:#0008;z-index:4}.mobile-brand{display:flex}.content{padding-top:24px}.composer-wrap{padding-inline:18px}.topbar{padding-inline:16px}}
    @media(max-width:560px){.topbar{height:58px}.model-tag{padding:6px 9px;font-size:10px}.model-tag .status-label{display:none}.content{padding:16px 17px 10px}.welcome{margin:auto 0 10px}.orb{width:66px;height:66px;border-radius:23px;margin-bottom:17px}.orb svg{width:35px}.welcome h1{font-size:27px}.welcome p{font-size:12px}.suggestions{gap:8px;margin:18px auto 18px}.suggestion{min-height:72px;padding:11px 12px}.suggestion strong{font-size:11px}.suggestion span{font-size:10px}.messages{gap:20px;padding-top:12px}.message{gap:9px}.avatar{width:27px;height:27px;border-radius:9px}.message.assistant .message-body{font-size:13px}.message.user .message-body{padding:10px 12px}.composer-wrap{padding:0 12px calc(10px + env(safe-area-inset-bottom))}.composer{border-radius:19px;padding:8px 9px}.composer textarea{min-height:49px;font-size:14px}.disclaimer{font-size:9px}.composer-hint{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
    body.light{--bg:#f7f5fa;--panel:#fff;--panel2:#f0edf4;--line:#211b2a17;--text:#211b2a;--muted:#716b7b;--soft:#4d4758;--user:#eeebf3;--shadow:0 18px 70px #29203a14;color-scheme:light}
    body.light .sidebar{background:linear-gradient(160deg,#f2eff7,#f7f5fa 55%,#f2eef8)}body.light .main{background:radial-gradient(ellipse 680px 470px at 52% 18%,#e9def248,transparent 75%),radial-gradient(ellipse 480px 400px at 92% 88%,#dfe9f440,transparent 74%),var(--bg)}body.light .composer{background:linear-gradient(145deg,#fff,#f7f4fa);border-color:#2e254116}body.light .model-tag,body.light .suggestion{background:#fff9;border-color:#33283a18}body.light .message.user .message-body{background:#f0edf5;border-color:#33283a10}body.light .message.assistant .message-body{color:#30293a}body.light .message-text pre{background:#f0edf5;border-color:#33283a18}body.light .chat-item:hover,body.light .chat-item.active,body.light .icon-btn:hover{background:#20172b0a}body.light .topbar{border-color:#33283a10}

<body>
  <div class="app" id="app">
    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar" aria-label="قائمة المحادثات">
      <div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 20.5c0-6.2 4-11 9.3-11 4.6 0 8.7 3.7 8.7 8.5 0 4.4-3 7.5-6.6 7.5-2.6 0-4.2-1.6-4.2-3.9 0-2.6 1.6-5.5 4-7.8M8.8 24.3c1.8-2.9 3.4-6.9 4.5-10.2" stroke="#21142b" stroke-width="2.5" stroke-linecap="round"/><circle cx="23.8" cy="9.1" r="2" fill="#fff" fill-opacity=".85"/></svg></div><div><strong>شوق</strong><small>مساعدك الذكي</small></div></div>
      <button class="new-chat" id="newChat"><span>＋</span> محادثة جديدة</button>
      <div class="side-label">محادثاتك</div>
      <div class="chat-list" id="chatList"></div>
      <div class="side-bottom"><div class="profile-mark">ش</div><div class="profile-copy"><b>مساحتك الخاصة</b><small>محادثات محفوظة على جهازك</small></div><button class="icon-btn" id="clearChats" title="حذف كل المحادثات" aria-label="حذف كل المحادثات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left"><button class="icon-btn" id="menuBtn" aria-label="فتح القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="mobile-brand"><div class="mark"><svg viewBox="0 0 32 32" fill="none"><path d="M7 20.5c0-6.2 4-11 9.3-11 4.6 0 8.7 3.7 8.7 8.5 0 4.4-3 7.5-6.6 7.5-2.6 0-4.2-1.6-4.2-3.9 0-2.6 1.6-5.5 4-7.8M8.8 24.3c1.8-2.9 3.4-6.9 4.5-10.2" stroke="#21142b" stroke-width="2.5" stroke-linecap="round"/></svg></div><span>شوق</span></div><div class="model-tag"><i class="status-dot" id="statusDot"></i><span class="status-label" id="statusLabel">المساعد جاهز</span></div></div>
        <div class="top-actions"><button class="icon-btn" id="themeBtn" title="تبديل المظهر" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg></button></div>
      </header>
      <section class="main-scroll" id="mainScroll"><div class="content" id="content"><div class="welcome" id="welcome"><div class="orb"><svg viewBox="0 0 32 32" fill="none"><path d="M7 20.5c0-6.2 4-11 9.3-11 4.6 0 8.7 3.7 8.7 8.5 0 4.4-3 7.5-6.6 7.5-2.6 0-4.2-1.6-4.2-3.9 0-2.6 1.6-5.5 4-7.8M8.8 24.3c1.8-2.9 3.4-6.9 4.5-10.2" stroke="#28152f" stroke-width="2.5" stroke-linecap="round"/><circle cx="23.8" cy="9.1" r="2" fill="#fff" fill-opacity=".8"/></svg></div><h1>أهلًا، أنا <span class="gradient-text">شوق</span></h1><p>وش ودّك تسوي اليوم؟<br>أنا هنا أساعدك تفكر، تتعلّم، وتنجز.</p></div><div class="suggestions" id="suggestions"><button class="suggestion" data-prompt="ساعدني أخطط لأسبوعي بطريقة عملية"><strong>رتّب أفكارك</strong><span>ساعدني أخطط لأسبوعي</span></button><button class="suggestion" data-prompt="اشرح لي الذكاء الاصطناعي التوليدي ببساطة مع أمثلة"><strong>تعلّم شيء جديد</strong><span>شرح بسيط مع أمثلة</span></button><button class="suggestion" data-prompt="اكتب لي رسالة لطيفة أرسلها لصديقي"><strong>اكتب معي</strong><span>رسالة أو فكرة أو قصة</span></button><button class="suggestion" data-prompt="أعطني ثلاث أفكار لعشاء سريع ولذيذ"><strong>خذ إلهام</strong><span>ثلاث أفكار مختلفة</span></button></div><div class="messages" id="messages" aria-live="polite"></div></div></section>
      <div class="composer-wrap"><form class="composer" id="composer"><textarea id="prompt" rows="1" maxlength="12000" placeholder="اسأل شوق أي شيء…" aria-label="اكتب رسالتك"></textarea><div class="composer-bottom"><span class="composer-hint">Enter للإرسال · Shift + Enter لسطر جديد</span><button class="send" id="send" type="submit" disabled aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></form><div class="disclaimer">قد يخطئ الذكاء الاصطناعي أحيانًا؛ تحقّق من المعلومات المهمة.</div></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const STORE='shouq.chats.v1', ACTIVE='shouq.active.v1';
    const $=s=>document.querySelector(s), app=$('#app'), list=$('#chatList'), messagesEl=$('#messages'), welcome=$('#welcome'), suggestions=$('#suggestions'), input=$('#prompt'), sendBtn=$('#send');
    const iconChat='<svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.6-3A7.5 7.5 0 1 1 20 11.5Z"/></svg>';
    const iconAI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg>';
    let chats=loadChats(), activeId=localStorage.getItem(ACTIVE)||null, controller=null, toastTimer;
    function loadChats(){try{const x=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
    function save(){try{localStorage.setItem(STORE,JSON.stringify(chats));if(activeId)localStorage.setItem(ACTIVE,activeId);else localStorage.removeItem(ACTIVE)}catch{showToast('مساحة التخزين ممتلئة. احذف بعض المحادثات.')}}
    function current(){return chats.find(c=>c.id===activeId)||null}
    function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function markdown(text){let safe=escapeHTML(text);safe=safe.replace(/```([\s\S]*?)```/g,(_,code)=>'<pre><code>'+code.trim()+'</code></pre>');safe=safe.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');return safe.split(/\n{2,}/).map(block=>{if(block.startsWith('<pre>'))return block;const lines=block.split('\n');if(lines.every(line=>/^\s*[-*]\s+/.test(line)))return '<ul>'+lines.map(l=>'<li>'+l.replace(/^\s*[-*]\s+/,'')+'</li>').join('')+'</ul>';return '<p>'+block.replace(/\n/g,'<br>')+'</p>'}).join('')}
    function showToast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
    function titleOf(chat){const m=chat.messages.find(x=>x.role==='user');return (m?.content||'محادثة جديدة').replace(/\s+/g,' ').slice(0,40)}
    function renderList(){list.innerHTML='';for(const chat of chats){const row=document.createElement('div');row.className='chat-item'+(chat.id===activeId?' active':'');row.innerHTML=iconChat+'<span></span><button class="delete-chat" title="حذف المحادثة" aria-label="حذف المحادثة">×</button>';row.querySelector('span').textContent=titleOf(chat);row.addEventListener('click',e=>{if(e.target.closest('.delete-chat')){e.stopPropagation();deleteChat(chat.id);return}activeId=chat.id;save();render()});list.append(row)}}
    function render(){renderList();const chat=current();welcome.hidden=!!chat?.messages.length;suggestions.hidden=!!chat?.messages.length;messagesEl.innerHTML='';if(chat)chat.messages.forEach((m,i)=>messagesEl.append(makeMessage(m,i,chat)));$('#mainScroll').scrollTop=$('#mainScroll').scrollHeight}
    function makeMessage(message,index,chat){const row=document.createElement('article');row.className='message '+message.role;const avatar=message.role==='assistant'?iconAI:'ش';row.innerHTML='<div class="avatar">'+avatar+'</div><div class="message-body"><div class="message-text"></div><div class="message-actions"></div></div>';const text=row.querySelector('.message-text');if(message.pending)text.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';else text.innerHTML=markdown(message.content||'');if(message.role==='assistant'&&!message.pending){const copy=document.createElement('button');copy.textContent='نسخ';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(message.content);showToast('تم نسخ الرد')}catch{showToast('تعذر النسخ على هذا الجهاز')}});row.querySelector('.message-actions').append(copy)}return row}
    function newChat(){if(controller){controller.abort();controller=null}activeId=null;save();render();input.value='';autoSize();closeMenu();input.focus()}
    function deleteChat(id){if(controller){controller.abort();controller=null}chats=chats.filter(c=>c.id!==id);if(activeId===id)activeId=chats[0]?.id||null;save();render()}
    function closeMenu(){app.classList.remove('menu-open')}
    function autoSize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,190)+'px';sendBtn.disabled=!input.value.trim()||!!controller}
    async function sendMessage(text){text=text.trim();if(!text||controller)return;if(text.length>12000){showToast('الرسالة طويلة جدًا.');return}let chat=current();if(!chat){chat={id:crypto.randomUUID(),messages:[],updatedAt:Date.now()};chats.unshift(chat);activeId=chat.id}chat.messages.push({role:'user',content:text});const answer={role:'assistant',content:'',pending:true};chat.messages.push(answer);chat.updatedAt=Date.now();save();render();input.value='';autoSize();controller=new AbortController();sendBtn.innerHTML='<span style="font-size:18px">■</span>';sendBtn.disabled=false;
      try{const history=chat.messages.filter(m=>!m.pending).slice(-24).map(m=>({role:m.role,content:m.content}));const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history}),signal:controller.signal});if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error||'تعذر إرسال الرسالة.')}if(!response.body)throw new Error('المتصفح لا يدعم الرد المباشر.');answer.pending=false;render();const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop()||'';for(const event of events){const line=event.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const payload=line.slice(6);if(payload==='[DONE]')continue;let data;try{data=JSON.parse(payload)}catch{continue}if(data.error)throw new Error(data.error);if(data.text){answer.content+=data.text;const node=messagesEl.lastElementChild?.querySelector('.message-text');if(node)node.innerHTML=markdown(answer.content);$('#mainScroll').scrollTop=$('#mainScroll').scrollHeight}}}if(!answer.content)answer.content='ما وصلني رد. جرّب مرة ثانية.';chat.updatedAt=Date.now();save();renderList();}
      catch(error){if(error.name!=='AbortError'){answer.pending=false;answer.content=error.message||'تعذر إكمال الرد.';render();showToast(error.message||'تعذر إكمال الرد.')}}finally{controller=null;sendBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>';autoSize();save()}}
    $('#composer').addEventListener('submit',e=>{e.preventDefault();if(controller){controller.abort();controller=null}else sendMessage(input.value)});input.addEventListener('input',autoSize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(controller){controller.abort();controller=null}else sendMessage(input.value)}});
    $('#newChat').addEventListener('click',newChat);$('#menuBtn').addEventListener('click',()=>app.classList.toggle('menu-open'));$('#backdrop').addEventListener('click',closeMenu);$('#clearChats').addEventListener('click',()=>{if(!chats.length)return;if(confirm('تحذف كل المحادثات المحفوظة على هذا الجهاز؟')){if(controller)controller.abort();chats=[];activeId=null;save();render()}});document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>sendMessage(b.dataset.prompt)));if(localStorage.getItem('shouq.theme')==='light')document.body.classList.add('light');$('#themeBtn').addEventListener('click',()=>{const light=document.body.classList.toggle('light');localStorage.setItem('shouq.theme',light?'light':'dark')});
    render();if(activeId&&!current()){activeId=null;save()}fetch('/health').then(r=>r.json()).then(s=>{if(!s.aiReady){$('#statusLabel').textContent='بانتظار إعداد الذكاء الاصطناعي';$('#statusDot').style.background='#f0b66c';$('#statusDot').style.boxShadow='none'}}).catch(()=>{$('#statusLabel').textContent='تحقق من الاتصال'});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
